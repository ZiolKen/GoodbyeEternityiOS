name: "Build iOS Unsigned iPA"

on: [push]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

jobs:
  build_ios:
    runs-on: macos-latest
    steps:
      - name: checkout repository
        uses: actions/checkout@v4
      - name: build archive and ipaify
        run: |
          echo $FORCE_JAVASCRIPT_ACTIONS_TO_NODE24
          echo $ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION
          node -v
          set -xe
          wget -O archive.zip "https://pixeldrain.com/api/file/viDkXTFV?download"
          unzip -o archive.zip -d .
          xcodebuild -list -project "Mii Chan.xcodeproj"
          xcodebuild archive \
            -project "Mii Chan.xcodeproj" \
            -scheme "Mii Chan" \
            -archivePath "Mii Chan.xcarchive" \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO
          mkdir Payload
          mv Mii\ Chan.xcarchive/Products/Applications/*.app Payload/
          zip -r MiiChan-v1.0.3-iOS.ipa Payload
          mv MiiChan-v1.0.3-iOS.ipa ${{ runner.temp }}/MiiChan-v1.0.3-iOS.ipa
      - name: upload application
        uses: actions/upload-artifact@v4
        with:
          name: "MiiChan"
          path: ${{ runner.temp }}/MiiChan-v1.0.3-iOS.ipa
          # You can also archive the entire directory
          # Path: ${{ runner.temp }}/build
          retention-days: 3
