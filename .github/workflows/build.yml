name: "Build iOS Unsigned iPA"

on: [push]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

jobs:
  build_ios:
    runs-on: macos-latest
    steps:
      - name: checkout repository
        uses: actions/checkout@v4
      - name: build archive and ipaify
        run: |
          echo $FORCE_JAVASCRIPT_ACTIONS_TO_NODE24
          echo $ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION
          node -v
          set -xe
          wget -O archive.zip "https://pixeldrain.com/api/file/GbRU5DyT?download"
          unzip -o archive.zip -d .
          xcodebuild -list -project "バイト先の後輩と同棲生活.xcodeproj"
          xcodebuild archive \
            -project "バイト先の後輩と同棲生活.xcodeproj" \
            -scheme "バイト先の後輩と同棲生活" \
            -archivePath "バイト先の後輩と同棲生活.xcarchive" \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO
          mkdir Payload
          mv \バイト先の後輩と同棲生活.xcarchive/Products/Applications/*.app Payload/
          zip -r バイト先の後輩と同棲生活-v1.0-iOS.ipa Payload
          mv バイト先の後輩と同棲生活-v1.0-iOS.ipa ${{ runner.temp }}/バイト先の後輩と同棲生活-v1.0-iOS.ipa
      - name: upload application
        uses: actions/upload-artifact@v4
        with:
          name: "バイト先の後輩と同棲生活"
          path: ${{ runner.temp }}/バイト先の後輩と同棲生活-v1.0-iOS.ipa
          # You can also archive the entire directory
          # Path: ${{ runner.temp }}/build
          retention-days: 3
